<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Antic+Didone&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Contenido principal de la página -->
  <header>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="galeria.html">Galería</a></li>
        <li class="logo"><img src="img/CHARLS RAW BLANCO PNG.png" alt="Logo"><h1>Charls.Raw Studio</h1></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="carta.html">Promociones</a></li>
    </ul>
    </nav>
  </header>

    <div class="container">
        <br><br><h2>Contacto</h2>
        <form id="contactoForm">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
            <span class="error" id="errorNombre"></span>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email">
            <span class="error" id="errorEmail"></span>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje"></textarea>
            <span class="error" id="errorMensaje"></span>

            <button type="submit">Enviar</button>
        </form>
        <p class="success" id="mensajeExito"></p>
    </div>

    <footer>
        <p>Charl's.Raw Studio © 2024 by Marcel Mañas is licensed under CC BY-ND 4.0 </p>
    </footer>

    <script src="js/formulario.js"></script> <!-- Conexión con JavaScript -->

</body>
</html>
